services:
  sing-box:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: kora-singbox
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    volumes:
      - ./config/config.json:/etc/sing-box/config.json:ro
    command: run -c /etc/sing-box/config.json
